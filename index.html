<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabina Fotográfica - Estilo K-Booth</title>
    <link rel="stylesheet" href="estilos/style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Dela+Gothic+One&display=swap" rel="stylesheet">
</head>
<body>

    <!-- ================= ESCENA 1: INICIO Y ANIMACIÓN ================= -->
    <div id="intro-scene" class="scene active">
        <div class="booth-exterior">
            <div class="booth-sign">✨ PHOTO ROOM ✨</div>
            <div class="curtains-container">
                <div class="curtain left-curtain"></div>
                <div class="curtain right-curtain"></div>
            </div>
            <div class="booth-slot"></div>
        </div>

        <!-- Muñequito caminando hacia la cabina -->
        <div id="character" class="character">
            <div class="head"></div>
            <div class="body"></div>
            <div class="legs"></div>
        </div>

        <div class="intro-content">
            <h1>K-Photo Booth</h1>
            <p>Tus fotos estilo cabina coreana con marcos y plantillas lindas.</p>
            <button id="enter-btn" class="btn primary-btn">TOCAR PARA ENTRAR 📸</button>
        </div>
    </div>

    <!-- ================= ESCENA 2: CABINA EN VIVO ================= -->
    <div id="booth-scene" class="scene">
        <div class="booth-inner">
            <header class="booth-header">
                <h2>MARROCOCCO'S BOOTH</h2>
                <div class="settings-bar">
                    <button id="mirror-btn" class="icon-btn" title="Espejo">🔄 Espejo</button>
                    <select id="timer-select" class="select-styled">
                        <option value="3">Cuenta: 3s</option>
                        <option value="5">Cuenta: 5s</option>
                    </select>
                    <select id="filter-select" class="select-styled">
                        <option value="none">Filtro: Normal</option>
                        <option value="grayscale">B&W Clásico</option>
                        <option value="sepia">Sepia Vintage</option>
                        <option value="pastel">Soft Pink</option>
                        <option value="cyber">Y2K Glow</option>
                    </select>
                </div>
            </header>

            <div class="camera-stage">
                <div id="flash-overlay" class="flash"></div>
                <video id="webcam" autoplay playsinline muted></video>
                <canvas id="fallback-canvas" class="hidden"></canvas>
                <div id="countdown-display" class="hidden">3</div>
            </div>

            <div class="booth-footer">
                <div class="strip-preview-slots">
                    <div class="mini-slot" id="slot-0">1</div>
                    <div class="mini-slot" id="slot-1">2</div>
                    <div class="mini-slot" id="slot-2">3</div>
                    <div class="mini-slot" id="slot-3">4</div>
                </div>
                <button id="start-shoot-btn" class="btn action-btn">¡INICIAR SECUENCIA DE 4 FOTOS!</button>
            </div>
        </div>
    </div>

    <!-- ================= ESCENA 3: RESULTADOS Y TIRA FOTOGRÁFICA ================= -->
    <div id="result-scene" class="scene">
        <div class="result-container">
            <h2>✨ ¡Tira Fotográfica Lista! ✨</h2>
            <p class="result-subtitle">Elige tu diseño de marco favorito:</p>
            
            <!-- Selector de Marcos inspirado en Pinterest -->
            <div class="template-selector">
                <button class="frame-option active" data-frame="pink">🎀 Pink Sweet</button>
                <button class="frame-option" data-frame="black">🖤 Minimal Black</button>
                <button class="frame-option" data-frame="y2k">⭐ Star Cyber</button>
            </div>

            <div class="canvas-preview-wrapper">
                <canvas id="result-canvas"></canvas>
            </div>

            <div class="result-actions">
                <button id="download-btn" class="btn primary-btn">⬇️ DESCARGAR FOTOSTRIP</button>
                <button id="restart-btn" class="btn secondary-btn">🔄 NUEVA SESIÓN</button>
            </div>
        </div>
    </div>

    <!-- Lógica JavaScript -->
    <script>
        const introScene = document.getElementById('intro-scene');
        const boothScene = document.getElementById('booth-scene');
        const resultScene = document.getElementById('result-scene');
        const enterBtn = document.getElementById('enter-btn');
        const character = document.getElementById('character');
        const leftCurtain = document.querySelector('.left-curtain');
        const rightCurtain = document.querySelector('.right-curtain');
        
        const video = document.getElementById('webcam');
        const fallbackCanvas = document.getElementById('fallback-canvas');
        const flashOverlay = document.getElementById('flash-overlay');
        const countdownDisplay = document.getElementById('countdown-display');
        const startShootBtn = document.getElementById('start-shoot-btn');
        const mirrorBtn = document.getElementById('mirror-btn');
        const timerSelect = document.getElementById('timer-select');
        const filterSelect = document.getElementById('filter-select');
        const downloadBtn = document.getElementById('download-btn');
        const restartBtn = document.getElementById('restart-btn');
        const resultCanvas = document.getElementById('result-canvas');
        const frameButtons = document.querySelectorAll('.frame-option');

        let capturedImages = [];
        let isMirrored = true;
        let currentFilter = 'none';
        let currentFrameStyle = 'pink';
        let stream = null;

        // Entrar a la cabina con animación
        enterBtn.addEventListener('click', async () => {
            enterBtn.disabled = true;
            character.classList.add('walk-to-booth');

            setTimeout(() => {
                character.style.opacity = '0';
                leftCurtain.classList.add('open-left');
                rightCurtain.classList.add('open-right');
            }, 1800);

            setTimeout(async () => {
                introScene.classList.remove('active');
                boothScene.classList.add('active');
                await initCamera();
            }, 2600);
        });

        async function initCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 }, audio: false });
                video.srcObject = stream;
                video.style.display = 'block';
                fallbackCanvas.classList.add('hidden');
            } catch (err) {
                video.style.display = 'none';
                fallbackCanvas.classList.remove('hidden');
                startFallbackAnimation();
            }
        }

        function startFallbackAnimation() {
            const ctx = fallbackCanvas.getContext('2d');
            fallbackCanvas.width = 640;
            fallbackCanvas.height = 480;
            let hue = 300;
            function draw() {
                ctx.fillStyle = `hsl(${hue}, 60%, 90%)`;
                ctx.fillRect(0, 0, fallbackCanvas.width, fallbackCanvas.height);
                ctx.fillStyle = '#ff4d94';
                ctx.font = 'bold 28px Outfit';
                ctx.textAlign = 'center';
                ctx.fillText("✨ CÁMARA VIRTUAL ACTIVA ✨", fallbackCanvas.width / 2, 220);
                if (!boothScene.classList.contains('active')) return;
                requestAnimationFrame(draw);
            }
            draw();
        }

        mirrorBtn.addEventListener('click', () => {
            isMirrored = !isMirrored;
            video.style.transform = isMirrored ? 'scaleX(-1)' : 'scaleX(1)';
        });

        filterSelect.addEventListener('change', (e) => {
            currentFilter = e.target.value;
            video.className = currentFilter !== 'none' ? `filter-${currentFilter}` : '';
        });

        // Cambio de estilo de marco en pantalla de resultados
        frameButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                frameButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFrameStyle = btn.getAttribute('data-frame');
                generatePhotoStrip();
            });
        });

        // Tomar secuencia de 4 fotos
        startShootBtn.addEventListener('click', async () => {
            startShootBtn.disabled = true;
            capturedImages = [];
            
            for (let i = 0; i < 4; i++) {
                document.getElementById(`slot-${i}`).style.background = '#ffd1dc';
                const seconds = parseInt(timerSelect.value);
                await runCountdown(seconds);

                triggerFlash();
                playBeepSound();
                captureFrame(i);
                
                if (i < 3) await new Promise(r => setTimeout(r, 1200));
            }

            if (stream) stream.getTracks().forEach(track => track.stop());
            
            boothScene.classList.remove('active');
            resultScene.classList.add('active');
            generatePhotoStrip();
            startShootBtn.disabled = false;
        });

        function runCountdown(seconds) {
            return new Promise(resolve => {
                let currentSec = seconds;
                countdownDisplay.textContent = currentSec;
                countdownDisplay.classList.remove('hidden');
                
                const interval = setInterval(() => {
                    currentSec--;
                    if (currentSec > 0) {
                        countdownDisplay.textContent = currentSec;
                    } else {
                        clearInterval(interval);
                        countdownDisplay.classList.add('hidden');
                        resolve();
                    }
                }, 1000);
            });
        }

        function triggerFlash() {
            flashOverlay.style.opacity = '1';
            setTimeout(() => flashOverlay.style.opacity = '0', 200);
        }

        function playBeepSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.12);
            } catch (e) {}
        }

        function captureFrame(index) {
            const canvas = document.createElement('canvas');
            canvas.width = 640;
            canvas.height = 480;
            const ctx = canvas.getContext('2d');

            if (video.style.display !== 'none' && video.readyState === video.HAVE_ENOUGH_DATA) {
                if (isMirrored) {
                    ctx.translate(canvas.width, 0);
                    ctx.scale(-1, 1);
                }
                if (currentFilter === 'grayscale') ctx.filter = 'grayscale(100%)';
                if (currentFilter === 'sepia') ctx.filter = 'sepia(100%)';
                if (currentFilter === 'pastel') ctx.filter = 'contrast(105%) brightness(115%) saturate(130%)';
                if (currentFilter === 'cyber') ctx.filter = 'hue-rotate(90deg) saturate(180%)';

                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = '#ffb6c1';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 36px Outfit';
                ctx.textAlign = 'center';
                ctx.fillText(`FOTO #${index + 1}`, canvas.width / 2, canvas.height / 2);
            }

            capturedImages.push(canvas);
            document.getElementById(`slot-${index}`).style.background = '#ff4d94';
            document.getElementById(`slot-${index}`).style.color = '#fff';
            document.getElementById(`slot-${index}`).textContent = '✓';
        }

        function generatePhotoStrip() {
            const ctx = resultCanvas.getContext('2d');
            const stripWidth = 600;
            const photoWidth = 520;
            const photoHeight = 390;
            const padding = 40;
            const headerHeight = 100;
            const footerHeight = 80;
            const gap = 25;

            resultCanvas.width = stripWidth;
            resultCanvas.height = headerHeight + (photoHeight * 4) + (gap * 3) + footerHeight + (padding * 2);

            // Colores según el diseño elegido (Inspirado en templates de Pinterest)
            let bgColor = '#fff0f5';
            let textColor = '#ff4d94';
            let borderColor = '#ffb6c1';

            if (currentFrameStyle === 'black') {
                bgColor = '#1a1a1a';
                textColor = '#ffffff';
                borderColor = '#333333';
            } else if (currentFrameStyle === 'y2k') {
                bgColor = '#e6f0ff';
                textColor = '#3b82f6';
                borderColor = '#93c5fd';
            }

            // Fondo de la tira
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, resultCanvas.width, resultCanvas.height);

            // Marco decorativo
            ctx.strokeStyle = borderColor;
            ctx.lineWidth = 6;
            ctx.strokeRect(15, 15, resultCanvas.width - 30, resultCanvas.height - 30);

            // Encabezado
            ctx.fillStyle = textColor;
            ctx.font = 'bold 28px "Dela Gothic One", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText("LIFE FOUR CUTS", stripWidth / 2, padding + 45);

            // Dibujar las 4 fotos
            let currentY = padding + headerHeight;
            capturedImages.forEach((img, index) => {
                const x = (stripWidth - photoWidth) / 2;
                
                // Marco blanco interior para cada foto
                ctx.fillStyle = currentFrameStyle === 'black' ? '#2c2c2c' : '#ffffff';
                ctx.fillRect(x - 8, currentY - 8, photoWidth + 16, photoHeight + 16);

                ctx.drawImage(img, x, currentY, photoWidth, photoHeight);
                currentY += photoHeight + gap;
            });

            // Pie de página
            const today = new Date().toLocaleDateString();
            ctx.fillStyle = textColor;
            ctx.font = 'bold 16px Outfit, sans-serif';
            ctx.fillText(`✨ Marrococco's Booth • ${today} ✨`, stripWidth / 2, resultCanvas.height - padding - 25);
        }

        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = `photostrip-${currentFrameStyle}-${Date.now()}.png`;
            link.href = resultCanvas.toDataURL('image/png');
            link.click();
        });

        restartBtn.addEventListener('click', () => {
            resultScene.classList.remove('active');
            introScene.classList.add('active');
            enterBtn.disabled = false;
            character.style.opacity = '1';
            character.classList.remove('walk-to-booth');
            leftCurtain.classList.remove('open-left');
            rightCurtain.classList.remove('open-right');
            
            for (let i = 0; i < 4; i++) {
                const slot = document.getElementById(`slot-${i}`);
                slot.style.background = '#ffe6f0';
                slot.style.color = '#ff4d94';
                slot.textContent = i + 1;
            }
        });
    </script>
</body>
</html>
